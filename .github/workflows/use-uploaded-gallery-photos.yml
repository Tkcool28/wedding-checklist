name: Use uploaded gallery photos

on:
  push:
    paths:
      - .github/workflows/use-uploaded-gallery-photos.yml

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace remaining stock gallery photos
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<img src="https://images.pexels.com/photos/28976226/pexels-photo-28976226.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Outdoor rustic reception tables" loading="lazy">':
              '<img src="assets/15 Stunning DIY Wedding Decorations That Will Leave Your Guests Speechless (You Won’t Believe #8!).jpeg" alt="Rustic backyard wedding decorations" loading="lazy">',

              '<img src="https://images.pexels.com/photos/15964967/pexels-photo-15964967.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Backyard string lights celebration" loading="lazy">':
              '<img src="assets/17 _Ridiculously Elegant_ Navy Blue and Burnt Orange Wedding Ideas for 2025 That Are Wedding Goals.jpeg" alt="Navy and burnt orange wedding inspiration" loading="lazy">',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for gallery image, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/use-uploaded-gallery-photos.yml

      - name: Commit gallery photo update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace remaining stock gallery photos"
          git push
