name: Restore root page

on:
  push:
    paths:
      - .github/workflows/restore-root-page.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full page and keep assets working
        run: |
          cp backup/old2.html index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'PREVENT LOAD-TIME AUTOSCROLL'
          if marker not in s:
              patch = """
// PREVENT LOAD-TIME AUTOSCROLL
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.addEventListener('pageshow', function () {
  if (!window.location.hash) window.scrollTo(0, 0);
});
"""
              s = s.replace('</script>', patch + '\n</script>')
              p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/restore-root-page.yml
      - name: Commit restored page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore root page and image paths"
          git push
