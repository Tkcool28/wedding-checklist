name: Update hero layout

on:
  push:
    paths:
      - .github/workflows/update-hero-layout.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero overlays
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          changes = [
            ('<svg class="hero-crown anim" viewBox=', '<svg class="hero-crown anim" style="opacity:0" viewBox='),
            ('<h1 class="anim">Chandra</h1>', '<h1 class="anim" style="opacity:0">Chandra</h1>'),
            ('<div class="hero-ampersand anim">&</div>', '<div class="hero-ampersand anim" style="opacity:0">&</div>'),
            ('<h2 class="anim">Todd</h2>', '<h2 class="anim" style="opacity:0">Todd</h2>')
          ]
          for a, b in changes:
            if t.count(a) != 1:
              raise SystemExit(f'Unexpected match count for {a}')
            t = t.replace(a, b)
          p.write_text(t, encoding='utf-8')
          PY
          rm .github/workflows/update-hero-layout.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove hero overlays and preserve spacing"
          git push

# trigger
