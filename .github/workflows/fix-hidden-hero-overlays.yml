name: Fix hidden hero overlays

on:
  push:
    paths:
      - .github/workflows/fix-hidden-hero-overlays.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make hero overlays truly hidden
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('style="opacity:0"', 'style="visibility:hidden"')
          p.write_text(t, encoding='utf-8')
          PY
          rm .github/workflows/fix-hidden-hero-overlays.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep hero overlays hidden after animation"
          git push
