name: Update host location and story text

on:
  push:
    paths:
      - '.github/workflows/remove-wedding-couple-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update host location and remove ice cream from story
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('    <span>Our Backyard</span>', '    <span>Hosted by Denise and Frank Sireno</span>\n    <span>937 Wagonwheel Dr. Ft. Collins, CO.</span>'),
              ('<p>An intimate backyard celebration among closest friends and family: warm string lights, autumn colors, wood-fired pizza, whisky, cigars, ice cream, bonfire, and plenty of games.</p>', '<p>An intimate backyard celebration among closest friends and family: warm string lights, autumn colors, wood-fired pizza, whisky, cigars, bonfire, and plenty of games.</p>'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit host and story update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --stat
          git commit -m "Update wedding host location and story text" || exit 0
          git push

# host-location-story-trigger
