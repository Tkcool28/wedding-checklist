name: Remove RSVP note second sentence

on:
  push:
    paths:
      - '.github/workflows/remove-wedding-couple-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove second RSVP note sentence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''    <div class="rsvp-note">
      🎲 Chandra &amp; Todd ask all guests to bring a board game or card game! 🎲<br>
      Pizza, whisky, cigars, dessert bar, bonfire, and good people.
    </div>'''
          new = '''    <div class="rsvp-note">
      🎲 Chandra &amp; Todd ask all guests to bring a board game or card game! 🎲
    </div>'''

          if old not in text:
              raise SystemExit('Expected RSVP note block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit RSVP note update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --stat
          git commit -m "Remove extra RSVP note sentence" || exit 0
          git push

# remove-rsvp-note-second-sentence
