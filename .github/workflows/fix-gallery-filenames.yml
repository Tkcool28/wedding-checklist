name: Fix gallery filenames

on:
  push:
    paths:
      - .github/workflows/fix-gallery-filenames.yml

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename gallery images and update page
        run: |
          set -e

          old_one="assets/15 Stunning DIY Wedding Decorations That Will Leave Your Guests Speechless (You Won’t Believe #8!).jpeg"
          old_two="assets/17 _Ridiculously Elegant_ Navy Blue and Burnt Orange Wedding Ideas for 2025 That Are Wedding Goals.jpeg"
          new_one="assets/rustic-wedding-decor.jpeg"
          new_two="assets/navy-burnt-orange-wedding.jpeg"

          test -f "$old_one"
          test -f "$old_two"
          mv "$old_one" "$new_one"
          mv "$old_two" "$new_two"

          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'assets/15 Stunning DIY Wedding Decorations That Will Leave Your Guests Speechless (You Won’t Believe #8!).jpeg',
              'assets/rustic-wedding-decor.jpeg'
          )
          text = text.replace(
              'assets/17 _Ridiculously Elegant_ Navy Blue and Burnt Orange Wedding Ideas for 2025 That Are Wedding Goals.jpeg',
              'assets/navy-burnt-orange-wedding.jpeg'
          )
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/fix-gallery-filenames.yml

      - name: Commit filename fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify gallery image filenames"
          git push
