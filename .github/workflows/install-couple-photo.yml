name: Install couple photo

on:
  push:
    paths:
      - .github/workflows/install-couple-photo.yml

permissions:
  contents: write

jobs:
  install-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move photo into assets and update page
        run: |
          set -e
          test -f wedding-couple.webp
          mkdir -p assets
          mv wedding-couple.webp assets/wedding-couple.webp

          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<img src="https://images.pexels.com/photos/29569636/pexels-photo-29569636.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Playful outdoor wedding guests" loading="lazy">'
          new = '<img src="assets/wedding-couple.webp" alt="Chandra and Todd celebrating at their backyard wedding" loading="lazy">'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one third stock image reference, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/install-couple-photo.yml

      - name: Commit photo replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace stock wedding photo with couple portrait"
          git push
