name: Set hero from uploaded image

on:
  push:
    paths:
      - .github/workflows/set-hero-from-img.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap hero background
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "https://images.pexels.com/photos/12661104/pexels-photo-12661104.jpeg?auto=compress&cs=tinysrgb&w=1920"
          new = "assets/IMG_20260621_195305.jpg"
          count = text.count(old)
          if count == 0:
              raise SystemExit('Existing hero image URL not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/set-hero-from-img.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use IMG_20260621_195305 as hero background"
          git push
