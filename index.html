<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chandra & Todd's Wedding</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #201724; }
    #site-frame { display: block; width: 100%; height: 100%; border: 0; }
  </style>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
</head>
<body>
  <iframe id="site-frame" src="backup/old2.html" title="Chandra and Todd's wedding website"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('site-frame');
      function resetToTop() {
        window.scrollTo(0, 0);
        try {
          frame.contentWindow.history.scrollRestoration = 'manual';
          frame.contentWindow.scrollTo(0, 0);
        } catch (e) {}
      }
      frame.addEventListener('load', function () {
        resetToTop();
        setTimeout(resetToTop, 50);
        setTimeout(resetToTop, 250);
      });
      window.addEventListener('pageshow', resetToTop);
    }());
  </script>
</body>
</html>
